# /etc/nginx/sites-available/comercial-sidnet  (o install.sh troca DOMINIO e PHPSOCK)
server {
    listen 80;
    server_name DOMINIO;
    root /opt/comercial-sidnet/server/public;
    index index.php;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / { return 302 /painel/; }

    location ~ ^/(api/app-vendas|painel/index)\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param COMERCIAL_CONFIG /etc/comercial-sidnet/config.php;
        fastcgi_pass unix:PHPSOCK;
    }
    location /painel/ { try_files $uri /painel/index.php$is_args$args; }

    # qualquer outro .php ou arquivo escondido fica fechado
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
